msf_localizer:
  ros__parameters:
    map_frame: map
    odom_frame: odom
    base_frame: base_link
    cloud_topic: /velodyne_points
    odom_topic: /odom
    # 可选第二预测源，例如已有系统单独提供的 /odom_lio；本入口不启动建图。
    secondary_odom_topic: ''
    ndt_resolution: 1.0
    ndt_step_size: 0.1
    ndt_epsilon: 0.01
    ndt_max_iterations: 30
    map_leaf_size: 0.2
    scan_leaf_size: 0.4
    min_scan_range: 1.5
    max_scan_range: 60.0
    min_scan_points: 50
    matching_rate: 5.0
    max_fitness_score: 1.5  # 最近邻距离的均方值，单位 m²；需现场按地图调节
    max_correction_distance: 0.8
    max_correction_angle: 0.6
    initial_max_distance: 3.0
    initial_max_angle: 1.2
    max_odom_gap: 0.25
    max_cloud_age: 1.0
    localization_timeout: 2.0
    odom_timeout: 0.5
    transform_tolerance: 0.1
