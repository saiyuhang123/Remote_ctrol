# FAST-LIO 提供 map->odom；本文件不启动 AMCL。
# 新车 footprint 与转弯半径由 hardware.yaml 覆盖，初始速度 0.3m/s。
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 100
    always_reload_bt_xml: true
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    default_nav_to_pose_bt_xml: '@CHASSIS_NAV2_SHARE@/config/bt/navigate_to_pose_w_replanning_and_recovery.xml'
    default_nav_through_poses_bt_xml: '@CHASSIS_NAV2_SHARE@/config/bt/navigate_through_poses_w_replanning_and_recovery.xml'
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_smooth_path_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_spin_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_assisted_teleop_action_bt_node
    - nav2_back_up_action_bt_node
    - nav2_drive_on_heading_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_globally_updated_goal_condition_bt_node
    - nav2_is_path_valid_condition_bt_node
    - nav2_initial_pose_received_condition_bt_node
    - nav2_reinitialize_global_localization_service_bt_node
    - nav2_rate_controller_bt_node
    - nav2_distance_controller_bt_node
    - nav2_speed_controller_bt_node
    - nav2_truncate_path_action_bt_node
    - nav2_truncate_path_local_action_bt_node
    - nav2_goal_updater_node_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node
    - nav2_transform_available_condition_bt_node
    - nav2_time_expired_condition_bt_node
    - nav2_distance_traveled_condition_bt_node
    - nav2_single_trigger_bt_node
    - nav2_goal_updated_controller_bt_node
    - nav2_is_battery_low_condition_bt_node
    - nav2_navigate_through_poses_action_bt_node
    - nav2_navigate_to_pose_action_bt_node
    - nav2_remove_passed_goals_action_bt_node
    - nav2_planner_selector_bt_node
    - nav2_controller_selector_bt_node
    - nav2_goal_checker_selector_bt_node
    - nav2_controller_cancel_bt_node
    - nav2_wait_cancel_bt_node
    - nav2_spin_cancel_bt_node
    - nav2_back_up_cancel_bt_node
    - nav2_assisted_teleop_cancel_bt_node
    - nav2_is_battery_charging_condition_bt_node
bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: false
bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 1.0
    progress_checker_plugin: progress_checker
    goal_checker_plugins:
    - general_goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.5
      movement_time_allowance: 20.0
    general_goal_checker:
      stateful: true  # 进入容差即锁定成功，避免终点附近抖动反复判定
      plugin: nav2_controller::SimpleGoalChecker
      # 位置 10cm 精确到点；朝向容差放开（任意朝向均判到达，用户要求只管位置）
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 6.283
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.5
      lookahead_dist: 0.9    # 车速 0.5m/s；太短转向敏感会扭，太长切弯
      min_lookahead_dist: 0.3
      max_lookahead_dist: 1.5
      rotate_to_heading_angular_vel: 0.5
      transform_tolerance: 0.5
      xy_goal_tolerance: 0.10
      use_rotate_to_heading: false
      max_angular_accel: 1.5
      allow_reversing: true

local_costmap:
  local_costmap:
    ros__parameters:
      transform_tolerance: 0.5
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      footprint: '[ [0.50, 0.36], [0.50, -0.36], [-0.50, -0.36], [-0.50, 0.36] ]'
      plugins:
      - obstacle_layer
      - inflation_layer
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 10.0  # 陡衰减：3cm 软带内代价就掉光，窄缝中心保持自由，通过性不受影响
        inflation_radius: 0.32   # 略大于内切半径 0.29 的最小可用值：产生"离墙远代价低"的梯度，全局路径不再贴障碍边
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 15.0
          raytrace_min_range: 0.0   # 全距离射线清除（原 1.5m 近场保护会导致幽灵障碍滞留，牙子保护后续另议）
          obstacle_max_range: 10.0
          obstacle_min_range: 0.0
          inf_is_valid: true
      always_send_full_costmap: true
global_costmap:
  global_costmap:
    ros__parameters:
      transform_tolerance: 0.5
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: false
      footprint: '[ [0.50, 0.36], [0.50, -0.36], [-0.50, -0.36], [-0.50, 0.36] ]'
      resolution: 0.05
      track_unknown_space: true
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          inf_is_valid: true
          obstacle_max_range: 10.0
          obstacle_min_range: 0.0
          raytrace_max_range: 15.0
          raytrace_min_range: 0.0   # 同局部层：全距离射线清除，幽灵障碍随新帧即消
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 10.0  # 陡衰减：3cm 软带内代价就掉光，窄缝中心保持自由，通过性不受影响
        inflation_radius: 0.32   # 略大于内切半径 0.29 的最小可用值：产生"离墙远代价低"的梯度，全局路径不再贴障碍边
      always_send_full_costmap: true
map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ''
map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true
planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    use_sim_time: false
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_smac_planner/SmacPlannerHybrid
      tolerance: 0.1
      use_astar: true
      allow_unknown: true
      minimum_turning_radius: 1.0
      motion_model_for_search: REEDS_SHEPP
      angle_quantization_bins: 72
      max_iterations: 1000000
      max_planning_time: 5.0
smoother_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: global_costmap/costmap_raw
    footprint_topic: global_costmap/published_footprint
    robot_base_frame: base_link
    transform_timeout: 0.1
    smoother_plugins:
    - constrained_smoother
    constrained_smoother:
      # ConstrainedSmoother：障碍感知 + 最小转弯半径约束，替代 SimpleSmoother（不感知障碍会切弯）
      plugin: nav2_constrained_smoother/ConstrainedSmoother
      minimum_turning_radius: 0.69   # launch 时按 hardware.yaml 实测值再注入
      reversing_enabled: true
      path_downsampling_factor: 1
      path_upsampling_factor: 1
      keep_start_orientation: true
      keep_goal_orientation: true
      w_smooth: 2000000.0
      w_dist: 0.0
      w_curve: 30.0
      w_cost: 0.05        # 障碍代价权重高于默认 0.015，平滑不许往障碍上贴
      w_cost_cusp_multiplier: 3.0
      cusp_zone_length: 2.5
      optimizer:
        max_iterations: 100
        debug_optimizer: false
        fn_tol: 1.0e-07
        gradient_tol: 1.0e-10
        param_tol: 1.0e-15
        linear_solver_type: SPARSE_NORMAL_CHOLESKY
behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins:
    - backup
    - drive_on_heading
    - assisted_teleop
    - wait
    backup:
      plugin: nav2_behaviors/BackUp
    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading
    wait:
      plugin: nav2_behaviors/Wait
    assisted_teleop:
      plugin: nav2_behaviors/AssistedTeleop
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.5
    use_sim_time: false
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.6
    min_rotational_vel: 0.3
    rotational_acc_lim: 1.5
robot_state_publisher:
  ros__parameters:
    use_sim_time: false
waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity:
    - 0.5
    - 0.0
    - 0.8
    min_velocity:
    - -0.2
    - 0.0
    - -0.8
    max_accel:
    - 0.5
    - 0.0
    - 0.8
    max_decel:
    - -0.5
    - 0.0
    - -0.8
    odom_topic: odom
    odom_duration: 0.1
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    velocity_timeout: 1.0
