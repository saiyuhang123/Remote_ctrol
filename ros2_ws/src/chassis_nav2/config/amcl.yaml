# SLAM Toolbox 建图后的 AMCL 纯定位；只读取二维栅格地图。
# map->odom 由 AMCL 发布，odom->base_link 继续由轮速+IMU EKF 发布。
amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /scan
    map_topic: /map
    tf_broadcast: true
    transform_tolerance: 0.5

    # 每次启动/重置后等待 /initialpose，不假定车辆在地图原点。
    set_initial_pose: false
    always_reset_initial_pose: true
    save_pose_rate: -1.0

    # 此模型用于传播融合里程计的 SE(2) 位姿增量，不下发底盘运动命令。
    # 阿克曼运动约束继续由现有规划器、控制器和底盘桥处理。
    robot_model_type: nav2_amcl::DifferentialMotionModel
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    update_min_d: 0.05
    update_min_a: 0.087

    laser_model_type: likelihood_field
    laser_min_range: 0.3
    laser_max_range: 15.0
    max_beams: 60
    laser_likelihood_max_dist: 2.0
    sigma_hit: 0.2
    z_hit: 0.5
    z_rand: 0.5
    z_max: 0.05
    z_short: 0.05
    lambda_short: 0.1
    do_beamskip: false
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
