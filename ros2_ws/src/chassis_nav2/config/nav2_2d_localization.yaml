# 2D 纯定位专用：map->odom 由 slam_toolbox（localization 模式）提供，map_server 加载 2D 栅格地图。
# 与 3D 管线的 nav2.yaml 独立，互不改用。footprint 与转弯半径由 hardware.yaml 覆盖，普通导航直线指令上限 0.8m/s，倒车 0.3m/s。
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 100
    always_reload_bt_xml: true
    default_server_timeout: 1000  # 大地图清图/动作确认允许 1 秒，避免 20ms 误超时
    wait_for_service_timeout: 1000
    default_nav_to_pose_bt_xml: '@CHASSIS_NAV2_SHARE@/config/bt/navigate_to_pose_w_replanning_and_recovery.xml'
    default_nav_through_poses_bt_xml: '@CHASSIS_NAV2_SHARE@/config/bt/navigate_through_poses_w_replanning_and_recovery.xml'
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_smooth_path_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_spin_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_assisted_teleop_action_bt_node
    - nav2_back_up_action_bt_node
    - nav2_drive_on_heading_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_globally_updated_goal_condition_bt_node
    - nav2_is_path_valid_condition_bt_node
    - nav2_initial_pose_received_condition_bt_node
    - nav2_reinitialize_global_localization_service_bt_node
    - nav2_rate_controller_bt_node
    - nav2_distance_controller_bt_node
    - nav2_speed_controller_bt_node
    - nav2_truncate_path_action_bt_node
    - nav2_truncate_path_local_action_bt_node
    - nav2_goal_updater_node_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node
    - nav2_transform_available_condition_bt_node
    - nav2_time_expired_condition_bt_node
    - nav2_distance_traveled_condition_bt_node
    - nav2_single_trigger_bt_node
    - nav2_goal_updated_controller_bt_node
    - nav2_is_battery_low_condition_bt_node
    - nav2_navigate_through_poses_action_bt_node
    - nav2_navigate_to_pose_action_bt_node
    - nav2_remove_passed_goals_action_bt_node
    - nav2_planner_selector_bt_node
    - nav2_controller_selector_bt_node
    - nav2_goal_checker_selector_bt_node
    - nav2_controller_cancel_bt_node
    - nav2_wait_cancel_bt_node
    - nav2_spin_cancel_bt_node
    - nav2_back_up_cancel_bt_node
    - nav2_assisted_teleop_cancel_bt_node
    - nav2_is_battery_charging_condition_bt_node
bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: false
bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 1.0
    progress_checker_plugin: progress_checker
    goal_checker_plugins:
    - general_goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.2
      movement_time_allowance: 20.0
    general_goal_checker:
      stateful: true  # 进入容差即锁定成功，避免终点附近抖动反复判定
      plugin: nav2_controller::SimpleGoalChecker
      # 自由导航：RPP 到点位置容差 10cm，朝向容差 50°。
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.872664626
    FollowPath:
      # RPP 保留障碍减速与足迹碰撞检测；按路径顺序执行前进/倒车段，折返点停稳再换向。
      plugin: chassis_nav2::AckermannPursuitController
      desired_linear_vel: 0.80
      max_reverse_speed: 0.30
      minimum_turning_radius: 0.69  # launch 按 hardware.yaml 实测值覆盖
      max_angular_vel: 0.8
      use_velocity_scaled_lookahead_dist: true
      lookahead_time: 1.8
      min_lookahead_dist: 0.45
      max_lookahead_dist: 1.0
      use_interpolation: true
      # 4WS 实测最小半径 0.69m；弯道减速，低速仍保持足够前视，避免短周期左右纠偏。
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 1.2
      regulated_linear_scaling_min_speed: 0.08
      use_cost_regulated_linear_velocity_scaling: true
      inflation_cost_scaling_factor: 3.0
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 2.0
      approach_velocity_scaling_dist: 0.6
      min_approach_linear_velocity: 0.05
      transform_tolerance: 0.5
      xy_goal_tolerance: 0.10
      use_rotate_to_heading: false
      allow_reversing: true
      cusp_tolerance: 0.06
      terminal_lookahead_dist: 0.18
      cusp_heading_tolerance: 0.25
      cusp_deceleration: 0.4
      stopped_speed: 0.03
      cusp_stop_duration: 0.25

local_costmap:
  local_costmap:
    ros__parameters:
      transform_tolerance: 0.5
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      footprint: '[ [0.50, 0.36], [0.50, -0.36], [-0.50, -0.36], [-0.50, 0.36] ]'
      footprint_padding: 0.05
      plugins:
      - obstacle_layer
      - inflation_layer
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        # Safety first: padded footprint radius is ~0.33m. Keep a real
        # inflation band so the global path cannot hug walls/obstacles.
        cost_scaling_factor: 3.0
        inflation_radius: 0.40
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 15.0
          raytrace_min_range: 0.0   # 全距离射线清除（原 1.5m 近场保护会导致幽灵障碍滞留，牙子保护后续另议）
          obstacle_max_range: 10.0
          obstacle_min_range: 0.0
          inf_is_valid: true
      always_send_full_costmap: true
global_costmap:
  global_costmap:
    ros__parameters:
      transform_tolerance: 0.5
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: false
      footprint: '[ [0.50, 0.36], [0.50, -0.36], [-0.50, -0.36], [-0.50, 0.36] ]'
      footprint_padding: 0.05
      resolution: 0.05
      track_unknown_space: true
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          inf_is_valid: true
          obstacle_max_range: 10.0
          obstacle_min_range: 0.0
          raytrace_max_range: 15.0
          raytrace_min_range: 0.0   # 同局部层：全距离射线清除，幽灵障碍随新帧即消
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        # Safety first: padded footprint radius is ~0.33m. Keep a real
        # inflation band so the global path cannot hug walls/obstacles.
        cost_scaling_factor: 3.0
        inflation_radius: 0.40
      always_send_full_costmap: true
map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ''
map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true
planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    use_sim_time: false
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_smac_planner/SmacPlannerHybrid
      tolerance: 0.1
      use_astar: true
      allow_unknown: false
      minimum_turning_radius: 0.85  # 规划保留转向余量；控制器仍可用实测 0.69m 纠偏
      motion_model_for_search: REEDS_SHEPP
      # 三点路线长距离返程：保留倒车但减少为规避倒车代价而插入的多次换向。
      reverse_penalty: 1.05
      # 应 >= 规划半径的 4~5 倍；0.85m 半径不能沿用默认 3m 连接长度。
      analytic_expansion_max_length: 5.0
      angle_quantization_bins: 72
      # 搜索预算放宽到 1000 万次，由 max_planning_time 5s 兜底最坏耗时。
      max_iterations: 10000000
      max_planning_time: 5.0
smoother_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: global_costmap/costmap_raw
    footprint_topic: global_costmap/published_footprint
    robot_base_frame: base_link
    transform_timeout: 0.1
    smoother_plugins:
    - constrained_smoother
    constrained_smoother:
      # ConstrainedSmoother：障碍感知 + 最小转弯半径约束，替代 SimpleSmoother（不感知障碍会切弯）
      plugin: nav2_constrained_smoother/ConstrainedSmoother
      minimum_turning_radius: 0.69   # launch 时按 hardware.yaml 实测值再注入
      reversing_enabled: true
      path_downsampling_factor: 1
      path_upsampling_factor: 1
      keep_start_orientation: true
      keep_goal_orientation: true
      w_smooth: 2000000.0
      w_dist: 0.0
      w_curve: 30.0
      w_cost: 0.05        # 障碍代价权重高于默认 0.015，平滑不许往障碍上贴
      w_cost_cusp_multiplier: 3.0
      cusp_zone_length: 2.5
      optimizer:
        max_iterations: 100
        debug_optimizer: false
        fn_tol: 1.0e-07
        gradient_tol: 1.0e-10
        param_tol: 1.0e-15
        linear_solver_type: SPARSE_NORMAL_CHOLESKY
behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins:
    - backup
    - drive_on_heading
    - assisted_teleop
    - wait
    backup:
      plugin: nav2_behaviors/BackUp
    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading
    wait:
      plugin: nav2_behaviors/Wait
    assisted_teleop:
      plugin: nav2_behaviors/AssistedTeleop
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.5
    use_sim_time: false
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.6
    min_rotational_vel: 0.3
    rotational_acc_lim: 1.5
robot_state_publisher:
  ros__parameters:
    use_sim_time: false
waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: true
    feedback: OPEN_LOOP
    max_velocity:
    - 0.8
    - 0.0
    - 0.8
    min_velocity:
    - -0.3
    - 0.0
    - -0.8
    max_accel:
    - 0.4
    - 0.0
    - 0.8
    max_decel:
    - -0.6
    - 0.0
    - -1.2
    odom_topic: odom
    odom_duration: 0.1
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    velocity_timeout: 1.0
