twist_mux:
  ros__parameters:
    use_sim_time: false
    topics:
      navigation:
        topic: /cmd_vel_auto
        timeout: 0.5
        priority: 10
      final_approach:
        topic: /cmd_vel_final
        timeout: 0.5
        priority: 50
      teleop:
        topic: /cmd_vel_teleop
        timeout: 0.5
        priority: 100
    locks:
      emergency_stop:
        topic: /emergency_stop
        timeout: 0.0
        priority: 255
      patrol_guard:
        # Positive timeout is the dead-man behavior: before the first guard
        # message, and whenever patrol_guard dies, this lock becomes active and
        # blocks every velocity input with priority < 255.
        topic: /patrol/stop_lock
        timeout: 0.5
        priority: 255
