# 新 JD03 车：填写实测数据后才能启动定位/建图；drivers 模式不需要外参。
# 坐标约定：base_link 位于小车中心（用户确认），x 前、y 左、z 上。
# base_from_* 表示传感器坐标 -> base_link；translation 单位 m，rpy 单位 rad。
sensor_calibration:
  confirmed: true  # 雷达/IMU 安装位置和朝向已按用户提供的实测数据确认
  base_from_lidar:
    translation: [0.32, 0.0, 0.46]  # 相对 base_link：前方 32 cm，左侧 0 cm，上方 46 cm
    rpy: [0.0, 0.0, 0.0]  # 水平安装，雷达 X 轴与车头方向一致
  base_from_imu:
    translation: [0.32, 0.0, 0.22]  # 相对 base_link：前方 32 cm，上方 22 cm；位于雷达正下方 24 cm
    rpy: [0.0, 0.0, 0.0]  # 水平安装，IMU X 轴朝车头方向
  time_offset_lidar_to_imu: 0.0  # 尚未测量，需实测确认时间偏差

imu:
  port: /dev/imu_usb           # CH340 固定别名，由 wit_ros2_imu/script/imu_usb.rules 创建
  baudrate: 230400
  protocol: RS485_HIGH
  modbusID: 80
  publish_rate: 100.0
  print_debug: false

scan:
  # 实测（2026-10-14 室内平地）：地面簇 z=-0.193±0.011m，噪声上沿 -0.155m；阈值取离地 5cm。
  # 12cm 牙子顶部 z≈-0.07，高出阈值 7cm，可稳定标记；但 >2° 的坡会把地面切进来，坡道不可通行。
  # 注意：雷达近场盲区约 1.5m（垂直视场角），1.5m 内障碍本就没有回波。
  # 粗糙地面会使噪声带变厚，换场地需用 scripts/measure_ground_noise.py 重测后上调。
  min_height: -0.14
  max_height: 1.5
  range_min: 0.3
  range_max: 15.0
  angle_increment: 0.008726646 # 0.5 degree
  scan_time: 0.1

robot_geometry:
  confirmed: true            # 尺寸、轴距及最大转角已确认；底盘协调转向，上层按等效阿克曼计算
  wheel_base: 0.5            # 厂家参数图：轴距 500 mm，单位 m
  max_steering_deg: 24.0      # 用户确认轮胎最大转角 24°，低于厂家驱动编码上限 27°
  footprint:                 # 厂家长 895 mm、宽 560 mm，base_link 在中心；单位 m
    - [0.4475, 0.28]         # 左前
    - [0.4475, -0.28]        # 右前
    - [-0.4475, -0.28]       # 右后
    - [-0.4475, 0.28]        # 左后

# 纯轮速里程计独立确认，不要求雷达/IMU 外参或 footprint 已完成。
wheel_odometry:
  confirmed: true            # 2026-10-14 启用 wheel_imu 模式；比例为默认值，待实测校准
  rear_axle_translation: [-0.25, 0.0] # 假设 0.5m 轴距关于 base_link 居中；系估计值，需卷尺实测
  speed_scale: 1.0            # cur_speed 解码为 m/s，实测距离校准比例；假设为后轴纵向速度
  steering_scale: 1.0         # cur_steer 实际前轮角度的校准比例
  steering_bias_deg: 0.0      # cur_steer 加此零位偏差，再应用 feedback_steering_sign
  max_feedback_gap: 0.5       # 反馈间隔超过此值，不推算丢失期间的位移
  stamp_source: receipt      # 厂家 header 未填；使用本机接收时间。填好采样时间后可改 header
  speed_stddev: 0.05          # 估计噪声，m/s；需按实际反馈调整
  steering_stddev_deg: 1.0
  lateral_velocity_stddev: 0.02
  min_yaw_rate_stddev: 0.01   # 停车且方向盘回正时模型推算的角速度方差会退化为 0，
                             # 零方差测量会使下游 EKF 协方差奇异(NaN)；此为下限，rad/s

chassis:
  confirmed: true            # eno1 通信参数已核对，底盘反馈已收到；转向和速度按厂家协议转换
  command_steering_sign: -1.0
  feedback_steering_sign: -1.0 # 厂商 wheelAngle() 右转为正，ROS yaw 左转为正
  max_speed: 0.5
  cmd_timeout: 0.5
  four_wheel_steering: true # 双阿克曼反相四轮转向；若实测后轮与前轮同向偏（蟹行），把 rear_steering_sign 改为 -1.0
  rear_steering_sign: 1.0    # 实车验证(2026-10-14)：R 通道与前轮同号时几何反向（反相转弯）
  four_wheel_curvature_gain: 1.63 # 实测：满转角内圈直径 0.82m，中心半径 0.41+0.28=0.69m；κ = gain·tanδ/L
  steering_rate_dps: 45.0  # 舵机转角速率上限（度/秒）；防止控制器输出抖动时舵机疯狂摆动
  min_turning_radius: 0.69   # 实测(2026-10-14) 4WS 满转角内圈直径 0.82m 换算的车中心半径；规划器和精细接近按此限曲率
  driver:
    canbus_type: 1
    main_can_id: 1
    debug_can_id: 1
    can_eth_card: eno1
    can1_remote_ip: 192.168.1.10
    can1_remote_port: 4001
    can2_remote_ip: 192.168.1.10
    can2_remote_port: 4002
    local_ip: 192.168.1.102
    local_port: 8001
    debug_mode: false
    show_sending_msg: false
    car_type: JD03
    vehicle_weight: 30.0
