### ekf config file for ackermann_robot ###
ekf_filter_node:
    ros__parameters:
        frequency: 30.0
        sensor_timeout: 0.1
        two_d_mode: true
        transform_time_offset: 0.0
        transform_timeout: 0.0
        print_diagnostics: true
        debug: false
        publish_tf: true
        publish_acceleration: false

        map_frame: map
        odom_frame: odom
        base_link_frame: base_link
        world_frame: odom

        # -------------------------------------
        # 配置 1: 轮式里程计 (来自 gazebo_control.xacro)
        # -------------------------------------
        odom0: /odom
        odom0_config: [true,  true,  false,    # x, y 位置（由 vx/vyaw 积分得到，不漂）
                       false, false, true,     # yaw 朝向（运动学模型约束，不漂）
                       true,  false, false,    # vx 线速度
                       false, false, true,     # vyaw 角速度
                       false, false, false]
        # 说明：轮式里程计提供 x/y/yaw 绝对位姿，其误差有界，
        # 不会像 IMU 陀螺仪积分那样无界漂移。同时融合 vx/vyaw 速度。

        odom0_queue_size: 10
        odom0_nodelay: false
        odom0_differential: false
        odom0_relative: false

        # -------------------------------------
        # 配置 2: IMU (来自 sensors.xacro)
        # -------------------------------------
        imu0: /livox/imu
        # 你的 sensors.xacro 中重映射为了 /imu/data

        # IMU 配置矩阵:
        # x, y, z, roll, pitch, yaw,
        # vx, vy, vz, vroll, vpitch, vyaw,
        # ax, ay, az
        imu0_config: [false, false, false,
                      false, false, false,    # 去掉 yaw！陀螺仪积分朝向会漂，朝向由轮式里程计提供
                      false, false, false,
                      false, false, true,     # vyaw 角速度（陀螺仪直接测量，高频精准）
                      true,  false, false]    # ax 加速度
        # 说明：IMU 只融合 vyaw（高频角速度）和 ax（加速度），
        # yaw 朝向由轮式里程计运动学模型提供，不受陀螺仪 bias 漂移影响。

        imu0_nodelay: false
        imu0_differential: false
        imu0_relative: false
        
        imu0_queue_size: 10
        imu0_remove_gravitational_acceleration: true

        # -------------------------------------
