robot_patrol:
  ros__parameters:
    # Override with an absolute path in deployment or test environments.
    database_path: "~/.local/share/robot_patrol/patrol.sqlite3"
    map_frame: "map"
    base_frame: "base_link"
    point_timeout_sec: 300.0
    cancel_confirm_timeout_sec: 2.0
    # Real-car odometry at standstill can retain a small nonzero twist.
    # Wait longer and treat <=0.10 m/s, <=0.12 rad/s as stopped for 0.8 s.
    # This is only the post-Nav2 settle check; Nav2 goal checking remains 10cm/50°.
    settle_timeout_sec: 20.0
    settle_linear_threshold: 0.10
    settle_angular_threshold: 0.12
    # Only /patrol/save_current_point: tolerate low-speed odometry jitter.
    # Units: m/s and rad/s. Both absolute speeds must be within their limits.
    # These do not relax arrival, return-home or patrol_guard stop checks.
    record_point_linear_threshold: 0.08
    record_point_angular_threshold: 0.10
    settle_duration_sec: 0.8
    feedback_max_age_sec: 1.5
    tf_max_age_sec: 1.5
    map_feedback_timeout_sec: 2.0
    # Keep true for any vehicle execution. Tests must provide a fresh guard_ready.
    require_guard: true
    guard_timeout_sec: 2.0
    dwell_resume_position_tolerance_m: 0.5
    dwell_resume_yaw_tolerance_rad: 0.35
    min_dispatch_interval_sec: 0.5
    status_period_sec: 1.0
    executor_heartbeat_period_sec: 0.2
    teleop_topic: "/cmd_vel_teleop"
    return_cancel_timeout_sec: 15.0
    # Empty means derive from ROBOT_PROJECT_ROOT (or ~/Remote_ctrol).
    web_map_dir: ""
    # Point inspection actions: PTZ move -> capture -> online vision recognition.
    # The API key stays in a local file outside git (default /home/jkbot/dshapi).
    inspection_image_dir: "~/.local/share/robot_patrol/inspections"
    inspection_service_timeout_sec: 5.0
    inspection_capture_timeout_sec: 15.0
    inspection_recognition_timeout_sec: 150.0
    # Low-zoom sequence: enabled only on points explicitly calibrated with ptz_shots.
    # Device-wide, confirmed once: left turn decreases pan -> -1; increases -> 1.
    # Keep 0 until hardware confirmation. UI and CLI never ask per view.
    inspection_shot_pan_sign: 0
    inspection_shot_arrival_timeout_sec: 30.0
    inspection_shot_poll_sec: 0.3
    inspection_shot_stable_sec: 0.6
    inspection_shot_angle_tolerance_deg: 0.3
    inspection_shot_zoom_tolerance: 0.15
    inspection_shot_position_tolerance_m: 0.25
    inspection_shot_base_motion_m: 0.05
    inspection_shot_base_motion_deg: 1.0
    inspection_shot_stop_timeout_sec: 1.5
    # Legacy device-side presets: allow time for the camera to finish moving.
    inspection_preset_settle_sec: 5.0
    inspection_preset_service: "/hk_camera/preset"
    inspection_capture_service: "/hk_camera/capture"
    inspection_recognition_service: "/vision/recognize_image"
    inspection_default_prompt: |
      只按以下5行输出，每行都必须保留，没有识别到的内容写“无”；
      不要Markdown、不要编号、不要额外解释、不要描述背景、纸箱、货物或场景，不要推测：
      设备状态：
      仪表读数：
      指示灯：
      告警文字：
      明显异常：

inspection_recorder:
  ros__parameters:
    # Overridden by ROBOT_PATROL_DB when set.
    database_path: "~/.local/share/robot_patrol/patrol.sqlite3"

patrol_guard:
  ros__parameters:
    publish_period_sec: 0.05
    executor_timeout_sec: 1.5
    operator_timeout_sec: 1.5
    startup_grace_sec: 1.0
    odom_timeout_sec: 1.0
    stop_linear_threshold: 0.03
    stop_angular_threshold: 0.05
    require_operator_heartbeat: true
    require_mux_interlock: true
    mux_timeout_sec: 3.0
    mux_diagnostics_topic: "/diagnostics"
    nav2_action_name: "/navigate_to_pose"
    stale_goal_cancel_timeout_sec: 3.0
    stale_goal_service_timeout_sec: 2.0
    startup_nav_goal_quiet_sec: 2.0
    unexpected_nav_goal_grace_sec: 0.75
