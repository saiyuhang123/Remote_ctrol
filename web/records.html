<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>识别与抓拍记录 — 巡检机器人</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", sans-serif; margin: 0; background: #14171c; color: #dde3ea; }
  header { display: flex; align-items: center; gap: 14px; padding: 10px 18px;
           background: #1c2129; border-bottom: 1px solid #2a313c; }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  header a { color: #4fc3f7; text-decoration: none; font-size: 13px; }
  main { padding: 16px 18px; max-width: 1200px; margin: 0 auto; }
  .stats { display: flex; gap: 14px; margin-bottom: 16px; }
  .stat { background: #1c2129; border: 1px solid #2a313c; border-radius: 8px; padding: 12px 20px; }
  .stat .n { font-size: 24px; font-weight: 700; color: #4fc3f7; }
  .stat .t { font-size: 12px; color: #7d8a99; margin-top: 4px; }
  .filters { display: flex; gap: 8px; margin-bottom: 12px; }
  .filters button { padding: 6px 14px; font-size: 13px; border: 1px solid #2a313c; border-radius: 5px;
                    background: #1c2129; color: #dde3ea; cursor: pointer; }
  .filters button.active { background: #2d6da3; border-color: #2d6da3; }
  table { width: 100%; border-collapse: collapse; background: #1c2129; border-radius: 8px; overflow: hidden; }
  th, td { padding: 8px 12px; font-size: 13px; text-align: left; border-bottom: 1px solid #262d38; }
  th { color: #8fa1b5; font-weight: 600; background: #212730; }
  td img { width: 72px; height: 54px; object-fit: cover; border-radius: 4px; background: #000; cursor: pointer; }
  .tag { padding: 2px 8px; border-radius: 10px; font-size: 12px; }
  .tag.person { background: #1b5e20; } .tag.person_face { background: #4a3b8c; }
  .tag.vehicle_plate { background: #7a5b00; } .tag.capture { background: #0d47a1; }
  #empty { color: #6b7787; text-align: center; padding: 40px 0; }
</style>
</head>
<body>
<header>
  <h1>识别与抓拍记录</h1>
  <a href="/monitor.html">监控台</a> <a href="/points.html" style="margin-left:10px">巡检点</a> <a href="/plans.html" style="margin-left:10px">路线计划</a>
</header>
<main>
  <div class="stats">
    <div class="stat"><div class="n" id="sDetTotal">-</div><div class="t">识别记录总数</div></div>
    <div class="stat"><div class="n" id="sDetToday">-</div><div class="t">今日识别</div></div>
    <div class="stat"><div class="n" id="sCapTotal">-</div><div class="t">抓拍总数</div></div>
  </div>
  <div class="filters">
    <button data-f="" class="active">全部</button>
    <button data-f="person_face">人脸</button>
    <button data-f="person">行人</button>
    <button data-f="vehicle_plate">车牌</button>
    <button data-f="capture">手动抓拍</button>
  </div>
  <table>
    <thead><tr><th>时间</th><th>类型</th><th>内容</th><th>置信度</th><th>图片</th></tr></thead>
    <tbody id="tb"></tbody>
  </table>
  <div id="empty" style="display:none">暂无记录</div>
</main>
<script>
const NAME = { person: '行人', person_face: '人脸', vehicle_plate: '车牌', capture: '抓拍' };
let filter = '';

async function loadStats() {
  const s = await (await fetch('/api/records/summary')).json();
  document.getElementById('sDetTotal').textContent = s.detections_total;
  document.getElementById('sDetToday').textContent = s.detections_today;
  document.getElementById('sCapTotal').textContent = s.captures_total;
}

async function load() {
  let rows = [];
  if (filter === 'capture') {
    const r = await (await fetch('/api/records/captures?limit=100')).json();
    rows = r.items.map(i => ({ ...i, event: 'capture', label: '手动抓拍', score: 1 }));
  } else {
    const url = '/api/records/detections?limit=100' + (filter ? `&event=${filter}` : '');
    rows = (await (await fetch(url)).json()).items;
  }
  const tb = document.getElementById('tb');
  tb.innerHTML = '';
  document.getElementById('empty').style.display = rows.length ? 'none' : '';
  for (const r of rows) {
    const tr = document.createElement('tr');
    const time = new Date(r.ts * 1000).toLocaleString('zh-CN', { hour12: false });
    const img = r.image
      ? `<img src="/${r.image}" onclick="window.open('/${r.image}')" onerror="this.style.display='none'">`
      : '';
    tr.innerHTML = `<td>${time}</td>
      <td><span class="tag ${r.event}">${NAME[r.event] || r.event}</span></td>
      <td>${r.label}</td><td>${(r.score ?? 0).toFixed(2)}</td><td>${img}</td>`;
    tb.appendChild(tr);
  }
}

document.querySelectorAll('.filters button').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('.filters button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    filter = b.dataset.f;
    load();
  };
});

loadStats();
load();
setInterval(() => { loadStats(); load(); }, 10000);   // 10s 自动刷新
</script>
</body>
</html>
