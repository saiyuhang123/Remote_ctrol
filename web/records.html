<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>巡检记录 · 巡检机器人</title>
<script src="page-bridge.js"></script>
<link rel="stylesheet" href="theme.css">
<script src="ui.js" defer></script>
</head>
<body class="records-page">
<header class="page-header">
  <div class="page-title"><h1>巡检记录</h1><p>按巡检日期汇总路线、人脸抓拍、行人和车牌记录</p></div>
  <nav><a href="/monitor.html">监控台</a><a href="/tasks.html">巡检任务</a></nav>
  <span class="tag">每 15 秒自动更新</span>
</header>
<main class="records-layout">
  <div class="summary" aria-label="巡检记录统计">
    <div class="stat"><span class="icon" data-icon="route"></span><div class="t">巡检次数</div><div class="n" id="sessions">—</div></div>
    <div class="stat"><span class="icon" data-icon="face"></span><div class="t">人脸抓拍次数</div><div class="n" id="faces">—</div></div>
    <div class="stat"><span class="icon" data-icon="person"></span><div class="t">行人检测次数</div><div class="n" id="persons">—</div></div>
    <div class="stat"><span class="icon" data-icon="plate"></span><div class="t">车牌种类</div><div class="n" id="plates">—</div></div>
  </div>
  <section class="card">
    <div class="toolbar"><h2><span class="section-title"><span class="icon" data-icon="records"></span>巡检明细</span></h2><button class="btn gray" id="refresh"><span class="icon" data-icon="refresh"></span>刷新记录</button></div>
    <div id="error" role="alert"></div>
    <div class="table-wrap">
      <table class="records-table"><thead><tr><th>巡检日期</th><th>关联路线 / 运行</th><th>人脸抓拍</th><th>行人检测</th><th>识别车牌</th></tr></thead><tbody id="rows"></tbody></table>
    </div>
    <div id="empty" class="empty-state" style="display:none"><span class="icon" data-icon="records"></span><span>暂无巡检记录</span><p>开始巡检后，这里会自动汇总路线与识别记录</p></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
let routeNames = new Map();
let records = [];

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
async function loadRouteNames() {
  try {
    const state = await (await fetch('/api/local/state', {cache:'no-store'})).json();
    if (Array.isArray(state.routes))
      state.routes.forEach(route => routeNames.set(route.route_id, route.name));
  } catch (_) { /* route names are advisory; ids remain visible */ }
}
function platesOf(record) {
  const values = Array.isArray(record.plates) ? record.plates : [];
  return values.map(item => {
    if (typeof item === 'string') return {plate:item, count:1};
    return {plate:String(item.plate || ''), count:Number(item.count || 1)};
  }).filter(item => item.plate);
}
function renderSummary() {
  const uniquePlates = new Set();
  let faces = 0, persons = 0;
  for (const record of records) {
    faces += Number(record.face_capture_count || 0);
    persons += Number(record.person_count || 0);
    platesOf(record).forEach(item => uniquePlates.add(item.plate));
  }
  $('sessions').textContent = records.length;
  $('faces').textContent = faces;
  $('persons').textContent = persons;
  $('plates').textContent = uniquePlates.size;
}
function render() {
  const body = $('rows'); body.innerHTML = '';
  $('empty').style.display = records.length ? 'none' : '';
  for (const record of records) {
    const plateHtml = platesOf(record).map(item =>
      `<span class="plate">${escapeHtml(item.plate)} ×${item.count}</span>`).join('') ||
      '<span class="muted">未识别到车牌</span>';
    const route = routeNames.get(record.route_id) || record.route_id;
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${escapeHtml(record.inspection_date)}</td>
      <td><div>${escapeHtml(route)}</div>
          <div class="muted" style="font-size:11px">${escapeHtml(record.run_id)} · 地图 ${escapeHtml(record.map_id)}</div></td>
      <td><span class="count">${Number(record.face_capture_count || 0)}</span> 次</td>
      <td><span class="count">${Number(record.person_count || 0)}</span> 次</td>
      <td>${plateHtml}</td>`;
    body.appendChild(tr);
  }
}
async function load() {
  $('error').textContent = '';
  try {
    const response = await fetch('/api/inspection/records?limit=200', {cache:'no-store'});
    const data = await response.json();
    if (!response.ok) throw new Error(data.detail || '巡检记录读取失败');
    records = Array.isArray(data.items) ? data.items : [];
    renderSummary(); render();
  } catch (error) {
    records = []; renderSummary(); render();
    $('error').textContent = error.message || '巡检记录读取失败';
  }
}
$('refresh').onclick = load;
loadRouteNames().then(load);
setInterval(load, 15000);
</script>
</body>
</html>
