<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>巡检机器人 · 网页端</title>
<link rel="stylesheet" href="theme.css">
<script src="ui.js" defer></script>
</head>
<body class="landing-page">
<main class="landing">
  <div class="brand"><span class="brand-mark"><span class="icon" data-icon="robot"></span></span><div><strong>巡检机器人</strong><small>ROBOT CONTROL</small></div></div>
  <h1>巡检机器人控制台</h1>
  <p class="intro">查看机器人状态和相机画面，执行巡检任务，查询巡检记录。</p>
  <div class="entry-grid">
    <a class="entry-card" href="/monitor.html"><span class="icon" data-icon="monitor"></span><h2>现场监控</h2><p>地图与实时位姿、相机视频、手动遥控及环境气体。</p><span class="entry-link">进入监控台<span class="icon" data-icon="arrow"></span></span></a>
    <a class="entry-card" href="/tasks.html"><span class="icon" data-icon="route"></span><h2>巡检任务</h2><p>选择本地路线执行巡航，管理任务或返回待命点。</p><span class="entry-link">查看巡检任务<span class="icon" data-icon="arrow"></span></span></a>
    <a class="entry-card" href="/records.html"><span class="icon" data-icon="records"></span><h2>巡检记录</h2><p>查询巡检日期、关联路线及人脸抓拍、行人检测和车牌记录。</p><span class="entry-link">查看巡检记录<span class="icon" data-icon="arrow"></span></span></a>
  </div>
  <div id="health" role="status">正在读取系统状态…</div>
  <div class="landing-footer">地图、路线及设备启动由本地控制端管理</div>
</main>

<script>
(async () => {
  try {
    const response = await fetch('/api/health', {cache:'no-store'});
    const data = await response.json();
    document.getElementById('health').textContent =
      `后端 ${data.ok ? '在线' : '异常'} · 数据库 ${data.database_ok ? '只读可用' : '不可用'} · ` +
      `地图 ${data.map_ok ? `revision ${data.map_revision || 0}` : (data.map_error || '未导出')}`;
  } catch (error) {
    document.getElementById('health').textContent = `后端不可用：${error.message}`;
  }
})();
</script>
</body>
</html>
