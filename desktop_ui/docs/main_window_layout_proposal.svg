<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020" role="img" aria-labelledby="title desc">
  <title id="title">主界面美化布局建议</title>
  <desc id="desc">静态设计示意，尚未实现。顶部安全栏，左侧运行、导航、手动页签，中央真实 RViz，右侧相机、识别、业务点位页签，底部状态和日志。</desc>
  <defs>
    <style>
      text { font-family: 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', 'Microsoft YaHei', sans-serif; fill: #17253b; font-size: 15px; }
      .title { font-size: 22px; font-weight: 700; }
      .label { font-size: 16px; font-weight: 600; }
      .small { font-size: 13px; }
      .muted { fill: #52627a; }
      .blue { fill: #2563eb; }
      .white { fill: #ffffff; }
      .on-dark { fill: #c6d1df; }
      .panel { fill: #ffffff; stroke: #dce3ec; }
      .field { fill: #f8fafc; stroke: #dce3ec; }
      .button { fill: #ffffff; stroke: #cbd5e1; }
    </style>
  </defs>
  <rect width="1600" height="1020" fill="#f3f5f9"/>
  <rect x="0" y="0" width="1600" height="38" fill="#eaf1ff"/>
  <text x="24" y="25" class="small blue">设计示意 · 待实施 · 非真实运行画面，按钮与状态仅表达布局</text>

  <rect x="16" y="50" width="1568" height="66" rx="8" class="panel"/>
  <rect x="32" y="67" width="32" height="32" rx="8" fill="#2563eb"/>
  <path d="M40 90 V77 H56 V90 M44 73 V77 M52 73 V77" fill="none" stroke="#fff" stroke-width="2"/>
  <text x="77" y="80" class="title">巡检机器人控制台</text>
  <text x="79" y="101" class="small muted">本地 ROS2 · 会话来源按实际状态显示</text>
  <rect x="1012" y="67" width="124" height="32" rx="6" fill="#f3f5f9"/>
  <text x="1037" y="89" class="muted">观察模式</text>
  <rect x="1154" y="75" width="17" height="17" rx="3" fill="#fff" stroke="#94a3b8"/>
  <text x="1179" y="90">启用操作</text>
  <rect x="1274" y="63" width="152" height="40" rx="6" class="button"/>
  <text x="1288" y="89">取消导航 / 巡航</text>
  <rect x="1440" y="61" width="124" height="44" rx="6" fill="#c93434"/>
  <text x="1484" y="90" class="white label">急停</text>

  <rect x="16" y="128" width="1568" height="52" rx="8" class="panel"/>
  <text x="32" y="160" class="muted small">显示方案</text>
  <rect x="102" y="138" width="282" height="32" rx="5" class="field"/>
  <text x="115" y="160">FAST-LIO 定位 / Nav2 导航</text>
  <path d="M362 151 l5 5 l5 -5" fill="none" stroke="#52627a" stroke-width="2"/>
  <text x="406" y="160" class="blue">加载显示</text>
  <line x1="493" y1="141" x2="493" y2="167" stroke="#dce3ec"/>
  <text x="513" y="160">点选目标</text>
  <text x="611" y="160">初始位姿</text>
  <text x="710" y="160">交互 / 测距</text>
  <text x="826" y="160">显示项</text>
  <text x="1260" y="160" class="blue">地图编辑</text>
  <rect x="1376" y="138" width="188" height="32" rx="6" fill="#eaf1ff"/>
  <text x="1436" y="160" class="blue label">路线巡航</text>

  <rect x="16" y="192" width="286" height="654" rx="8" class="panel"/>
  <text x="34" y="220" class="label">操作工作区</text>
  <rect x="30" y="236" width="258" height="40" rx="6" fill="#f3f5f9"/>
  <rect x="34" y="240" width="82" height="32" rx="5" fill="#fff"/>
  <text x="58" y="262" class="blue label">运行</text>
  <text x="143" y="262" class="muted">导航</text>
  <text x="229" y="262" class="muted">手动</text>
  <text x="34" y="310" class="label">连接与会话</text>
  <text x="34" y="336" class="small muted">默认连接已有系统</text>
  <rect x="34" y="351" width="16" height="16" rx="3" fill="#fff" stroke="#94a3b8"/>
  <text x="59" y="365" class="small">由界面启动与管理流程</text>
  <line x1="34" y1="387" x2="284" y2="387" stroke="#e7edf5"/>
  <text x="34" y="415" class="label">地图文件</text>
  <text x="34" y="443" class="small muted">地图前缀</text>
  <rect x="34" y="454" width="250" height="36" rx="5" class="field"/>
  <text x="46" y="478" class="small muted">选择本机地图路径…</text>
  <text x="34" y="518" class="small muted">导航栅格 YAML（可选）</text>
  <rect x="34" y="529" width="250" height="36" rx="5" class="field"/>
  <text x="46" y="553" class="small muted">留空沿用地图前缀</text>
  <text x="34" y="600" class="label">启动选项</text>
  <text x="35" y="631" class="muted">□ 雷达 / IMU    □ 底盘驱动</text>
  <text x="35" y="661" class="muted">□ 底盘控制桥</text>
  <text x="35" y="691" class="muted">□ 启用路线巡航联锁</text>
  <text x="35" y="723" class="blue small">▸ 高级选项</text>
  <rect x="34" y="747" width="250" height="38" rx="6" fill="#2563eb"/>
  <text x="110" y="772" class="white label">启动所选流程</text>
  <rect x="34" y="797" width="119" height="32" rx="5" class="button"/>
  <text x="68" y="819" class="small">保存地图</text>
  <rect x="165" y="797" width="119" height="32" rx="5" class="button"/>
  <text x="194" y="819" class="small">停止流程</text>

  <rect x="314" y="192" width="942" height="654" rx="8" class="panel"/>
  <text x="334" y="222" class="label">地图与导航视图</text>
  <text x="1018" y="222" class="small muted">保留一个真实 RViz 实例</text>
  <rect x="326" y="237" width="918" height="597" rx="6" fill="#202832"/>
  <rect x="514" y="412" width="540" height="188" rx="12" fill="#263345" stroke="#415169"/>
  <text x="622" y="466" class="on-dark" style="font-size:24px;font-weight:600">地图 · 雷达 · 点云 · 路径</text>
  <text x="606" y="506" class="on-dark">此处沿用现有 RViz，静态示意不绘制真实地图</text>
  <text x="653" y="546" class="on-dark small">收起非必要面板，让地图获得主要空间</text>
  <rect x="346" y="783" width="202" height="32" rx="6" fill="#304057"/>
  <text x="363" y="805" class="on-dark small">显示配置与实际运行分别表达</text>

  <rect x="1268" y="192" width="316" height="654" rx="8" class="panel"/>
  <text x="1286" y="220" class="label">监控与业务</text>
  <text x="1556" y="220" class="muted">›</text>
  <rect x="1282" y="236" width="288" height="40" rx="6" fill="#f3f5f9"/>
  <rect x="1286" y="240" width="82" height="32" rx="5" fill="#fff"/>
  <text x="1310" y="262" class="blue label">相机</text>
  <text x="1382" y="262" class="muted small">抓拍识别</text>
  <text x="1482" y="262" class="muted small">业务点位</text>
  <rect x="1284" y="292" width="284" height="172" rx="6" fill="#202832"/>
  <path d="M1399 351 h40 v28 h-40 z M1439 357 l13 -7 v30 l-13 -7" fill="none" stroke="#8b9db4" stroke-width="2"/>
  <text x="1361" y="413" class="on-dark">实时视频区域</text>
  <text x="1328" y="440" class="small on-dark">未连接时展示说明与操作入口</text>
  <text x="1286" y="495" class="small muted">相机来源 / 服务 / 帧状态</text>
  <rect x="1286" y="511" width="134" height="34" rx="5" class="button"/>
  <text x="1326" y="534" class="small">启动相机</text>
  <rect x="1432" y="511" width="134" height="34" rx="5" class="button"/>
  <text x="1461" y="534" class="small">连接 / 恢复</text>
  <line x1="1286" y1="566" x2="1566" y2="566" stroke="#e7edf5"/>
  <text x="1286" y="595" class="label">云台与变倍</text>
  <text x="1286" y="620" class="small muted">按住动作，松开或离开页签停止</text>
  <rect x="1384" y="638" width="82" height="40" rx="5" class="field"/>
  <text x="1411" y="664">↑ 上</text>
  <rect x="1290" y="688" width="82" height="40" rx="5" class="field"/>
  <text x="1317" y="714">← 左</text>
  <rect x="1384" y="688" width="82" height="40" rx="5" class="button"/>
  <text x="1410" y="714">停止</text>
  <rect x="1478" y="688" width="82" height="40" rx="5" class="field"/>
  <text x="1502" y="714">右 →</text>
  <rect x="1384" y="738" width="82" height="40" rx="5" class="field"/>
  <text x="1411" y="764">↓ 下</text>
  <text x="1290" y="815" class="blue small">▸ 设备参数与更多操作</text>

  <rect x="16" y="858" width="1568" height="88" rx="8" class="panel"/>
  <text x="36" y="887" class="small muted">实际线速度</text>
  <text x="36" y="924" style="font-size:28px;font-weight:600">—</text>
  <text x="87" y="924" class="muted">m/s</text>
  <line x1="204" y1="875" x2="204" y2="929" stroke="#e7edf5"/>
  <text x="226" y="887" class="small muted">实际角速度</text>
  <text x="226" y="922">— rad/s</text>
  <text x="414" y="887" class="small muted">定位 / 导航</text>
  <text x="414" y="922">显示真实有效性</text>
  <text x="642" y="887" class="small muted">巡航任务</text>
  <text x="642" y="922">状态 · 圈数 · 步骤</text>
  <text x="898" y="887" class="small muted">电池</text>
  <text x="898" y="922">— %</text>
  <text x="1054" y="887" class="small muted">急停 / 巡航联锁</text>
  <text x="1054" y="922">分别展示，不把未知当作已解锁</text>
  <text x="1492" y="912" class="blue">详情 ›</text>

  <rect x="16" y="958" width="1568" height="42" rx="6" fill="#eaf0f7"/>
  <text x="34" y="985" class="small muted">消息摘要：操作结果与遥测状态分区，日志默认折叠</text>
  <text x="1462" y="985" class="blue small">展开日志 ↑</text>
</svg>
